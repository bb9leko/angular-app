<div class="card">
  <!--<img
    src="{{ ativo != undefined ? ativo : 'assets/imagens/capa-indisponivel.png'}}"
    alt="Capa do livro"> -->
  <div class="info-card">
    <p class="titulo">{{ ativo.ticket }}</p>
    <p class="informacoes">Corretora:</p>
    <p class="resultado">{{ ativo.corretora }}</p>
    <p class="informacoes">Preço Médio:</p>
    <p class="resultado">{{ ativo.valorMedio }}</p>
    <p class="informacoes">Valor Total Compras:</p>
    <p class="resultado">{{ ativo.valorTotalCompras }}</p>
    <button>Mais detalhes</button>
  </div>
</div>
<div *ngIf="modalAberto">
  <app-modal-ativo [ativo]="ativo" (mudouModal)="onModelChange($event)"></app-modal-ativo>
</div>
