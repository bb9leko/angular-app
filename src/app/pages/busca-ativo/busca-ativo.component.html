<section class="container">
  <header>Qual ativo procura?</header>
  <div class="busca">
    <input
      type="search"
      [(ngModel)]="campoBusca"
    >
    <button (click)="buscarAtivos()">
      Buscar
    </button>
  </div>
<div class="container-card" *ngIf="listaAtivos && listaAtivos.length > 0; else telaInicial">
  <div *ngFor="let ativo of listaAtivos">
    <app-ativo [ativo]="ativo"></app-ativo>
  </div>
</div>
<ng-template #telaInicial>
</ng-template>
